name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-cpu:
    name: Windows CPU selftest
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CPU only)
        working-directory: native
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DPLER_CUDA=OFF -DPLER_BUILD_GUI=ON -DPLER_ASSIMP=OFF

      - name: Build Release
        working-directory: native
        run: cmake --build build --config Release --target pler pler_shared pler_gui

      - name: Selftest
        working-directory: native/build/pler_cli/Release
        run: ./pler.exe selftest

      - name: Sample pair
        working-directory: native/build/pler_cli/Release
        run: ./pler.exe ${{ github.workspace }}/samples/ref_unit_sphere.obj ${{ github.workspace }}/samples/test_unit_sphere_lod.obj --rays 1000 --cpu
